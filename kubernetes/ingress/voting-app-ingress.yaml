apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voting-app-ingress
  namespace: voting-app
  labels:
    app.kubernetes.io/name: voting-app-ingress
    app.kubernetes.io/part-of: voting-app

spec:
  ingressClassName: nginx

  rules:
    - host: vote.stef.ironlabs.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vote-service
                port:
                  number: 80

    - host: result.stef.ironlabs.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: result-service
                port:
                  number: 80